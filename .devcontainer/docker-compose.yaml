version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: ["sleep", "infinity"]
    privileged: true
    cgroup: host
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:false
      - seccomp=unconfined
      - apparmor=unconfined
